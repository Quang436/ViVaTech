version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vivaarena_backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.8-flash
      - DATABASE_URL=sqlite:///./viva_arena.db
      - CHROMA_PERSIST_DIRECTORY=./chroma_db
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/viva_arena.db:/app/viva_arena.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vivaarena_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
